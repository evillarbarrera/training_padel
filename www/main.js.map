<div class="splash-container" [class.closing]="isClosing" *ngIf="showSplash">
  <div class="splash-ambient-glow"></div>
  
  <div class="splash-content">
    
    <!-- ANIMATED 3D ROTATING TENNIS / PADEL BALL -->
    <div class="ball-wrapper">
      <svg class="spinning-ball" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="ballGradient" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#FACC15" />
            <stop offset="45%" stop-color="#CCFF00" />
            <stop offset="85%" stop-color="#84CC16" />
            <stop offset="100%" stop-color="#4D7C0F" />
          </radialGradient>
          <filter id="ballGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="5" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        
        <!-- Ball Body -->
        <circle cx="50" cy="50" r="42" fill="url(#ballGradient)" filter="url(#ballGlow)" />
        
        <!-- White Padel/Tennis Curves -->
        <path d="M 22 15 A 38 38 0 0 1 85 78" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
        <path d="M 15 78 A 38 38 0 0 1 78 15" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" opacity="0.95" />
      </svg>
      <div class="ball-shadow"></div>
    </div>

    <!-- BRAND TYPOGRAPHY -->
    <div class="brand-text">
      <h1 class="brand-title">PadelBlox</h1>
      <span class="brand-subtitle">Gestión y evolución</span>
    </div>

    <!-- ELEGANT PROGRESS LINE & STATUS -->
    <div class="loader-box">
      <div class="progress-bar-track">
        <div class="progress-bar-fill"></div>
      </div>
      <p class="loading-status">Cargando experiencia<span class="dot-1">.</span><span class="dot-2">.</span><span class="dot-3">.</span></p>
    </div>

  </div>
</div>

<ion-app>
  <ion-router-outlet></ion-router-outlet>
</ion-app>
